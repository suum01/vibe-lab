function rear(){return `${defs}<rect width="800" height="515" fill="#111820"/><path d="M70 10H728L775 260 25 260Z" fill="url(#glass)" stroke="#262d35" stroke-width="27"/><path d="M65 235L180 165 280 192 420 152 520 170 695 130 748 239Z" fill="#9cafaa"/><path d="M0 235L85 240 121 515H0ZM800 235L715 240 679 515H800Z" fill="url(#door)"/><path d="M90 280Q400 220 710 280L748 515H52Z" fill="url(#leather)" stroke="#747f89" stroke-width="9"/><path d="M110 300Q400 260 690 300L674 485Q400 454 126 485Z" fill="#313941" stroke="#66727e" stroke-width="5"/><path d="M400 280L400 488" stroke="#6f7780" stroke-width="4"/><rect x="145" y="253" width="118" height="62" rx="20" fill="#323a43" stroke="#7d8791" stroke-width="8"/><rect x="533" y="253" width="118" height="62" rx="20" fill="#323a43" stroke="#7d8791" stroke-width="8"/>${hit('rearDuck',`<rect x="178" y="323" width="112" height="94" fill="transparent"/>${duck(223,358,1.2)}<rect class="shine" x="178" y="323" width="112" height="94" rx="17"/>`,'뒷좌석의 고무 오리')}<g filter="url(#shadow)"><path d="M430 335Q450 298 510 315L565 340 553 441 431 449Z" fill="#8b6849" stroke="#c2a37f" stroke-width="5"/><path d="M456 321Q482 282 520 319" fill="none" stroke="#c2a37f" stroke-width="11"/><path d="M437 372L555 372" stroke="#4a3c31" stroke-width="7"/><rect x="467" y="363" width="58" height="27" rx="5" fill="#2b3239" stroke="#e6c58b" stroke-width="3"/><text x="496" y="382" font-size="14" text-anchor="middle" fill="#ffd890">••••</text></g>${hit('bag','<path d="M425 294L574 300 585 460 418 460Z" fill="transparent"/><path class="shine" d="M425 294L574 300 585 460 418 460Z"/>','뒷좌석 가방')}<path d="M180 470Q380 444 617 466L665 515H137Z" fill="#10161b"/><path d="M220 483l339 0" stroke="#414c55" stroke-width="5"/>${hit('floor',`<path d="M245 458L555 458 593 515H201Z" fill="transparent"/><path class="shine" d="M245 458L555 458 593 515H201Z"/>`,'어두운 뒷좌석 바닥')}<rect x="329" y="23" width="142" height="48" rx="11" fill="#333b43" stroke="#8a9498" stroke-width="5"/><text x="400" y="53" text-anchor="middle" fill="#cbd5d8" font-size="14">앞좌석으로 돌아가기 ↶</text>${hit('front','<rect x="304" y="5" width="196" height="87" rx="12" fill="transparent"/><rect class="shine" x="304" y="5" width="196" height="87" rx="12"/>','앞좌석으로 돌아가기')}`}
function dialog(title,desc,keys){$('overlay').innerHTML=`<div class="dialogshade"><div class="dialog"><h2>${title}</h2><p>${desc}</p>${keys?`<div class="codebox" id="code">_ _ _ ${keys===4?'_':''}</div><div class="pad">${['1','2','3','4','5','6','7','8','9','지움','0','입력'].map(k=>`<button data-digit="${k}">${k}</button>`).join('')}</div>`:''}<button class="back" id="close">돌아가기</button></div></div>`;let val='';$('close').onclick=()=>{$('overlay').innerHTML=''};if(keys){$('overlay').querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{let d=b.dataset.digit;if(d==='지움')val=val.slice(0,-1);else if(d==='입력'){submitCode(val,keys,title);return}else if(val.length<keys)val+=d;$('code').textContent=val.padEnd(keys,'_').split('').join(' ')});}}
function submitCode(val,keys,title){
 if(title.includes('수납함')){
  if(val==='241'){
   S.glove=true;S.solved=Math.max(S.solved,1);add('손전등');add('피자 쿠폰');$('overlay').innerHTML='';say('찰칵! 수납함이 열렸다. 손전등과 피자 쿠폰을 발견!');
  }else{say('삐빅! 틀렸다. 오리가 세어 달라는 건 무엇일까?');}
 }else if(title.includes('가방')){
  if(!S.lit){say('쿠폰만으로는 알 수 없다. 뭔가 더 찾아야 한다.');return;}
  if(val==='7326'){
   S.bag=true;S.solved=Math.max(S.solved,2);add('비상키');add('친구 쪽지');$('overlay').innerHTML='';say('가방 개봉! 비상키와 친구의 수상한 쪽지를 찾았다.');
  }else{say('자물쇠가 꿈쩍도 하지 않는다.');}
 }else{
  if(val==='0815'){
   S.unlocked=true;S.solved=3;$('overlay').innerHTML='';say('철컥! 문 잠금이 풀렸다. 이제 운전석 문을 눌러보자!');
  }else{say('띠링~ 친구가 보낸 메시지: "우리 사이가 이것밖에 안 돼?"');}
 }
 render();
}

function add(item){if(!S.inventory.includes(item))S.inventory.push(item);S.selected=null;inventory()}
function inventory(){$('inventory').innerHTML=S.inventory.length?S.inventory.map(i=>`<button class="item ${S.selected===i?'active':''}" data-item="${i}">${({ '손전등':'🔦','피자 쿠폰':'🍕','영수증':'🧾','비상키':'🗝️','친구 쪽지':'📝'})[i]} ${i}</button>`).join(''):'<span class="empty">아직 아무것도 없다</span>';$('inventory').querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{const i=b.dataset.item;S.selected=S.selected===i?null:i;inventory();if(S.selected==='피자 쿠폰')say('쿠폰에 적힌 주문번호: 73??');else if(S.selected==='영수증')say('구겨진 영수증에 적힌 숫자: ??26');else if(S.selected==='친구 쪽지')say('"내 생일은 8월 15일! 까먹으면 절교다."');else if(S.selected)say(`${S.selected} 선택됨. 사용하고 싶은 사물을 눌러보자.`)})}
function say(txt){$('status').textContent=txt;const t=$('toast');t.textContent=txt;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3500)}
function ending(){dialog('🎉 탈출 성공!','문이 열렸다! "살았다! 면접까지 뛰어가면..."<br><br><strong class="ending">📅 그런데 오늘은 일요일이었다.</strong><br>면접은 내일 오전 10시.<br><br>"……다시 잘까?"',0);$('overlay').querySelector('.dialog').insertAdjacentHTML('beforeend','<button class="action" id="again">다시 플레이</button>');$('again').onclick=reset}
function interact(id){switch(id){case 'rear':case 'front':S.room=id;S.selected=null;render();say(id==='rear'?'뒷좌석. 누가 여기에 오리를 두고 갔지?':'다시 운전석. 손에 잡히는 것부터 조사하자.');break;case 'horn':say('빠아아앙!!! 🚙 "아침부터 시끄럽게 뭐 하는 거야!"');break;case 'gauges':say('주행거리 24,181km. 계기판엔 아무 문제도 없어 보인다.');break;case 'cup':if(!S.ducks.includes('cup'))S.ducks.push('cup');say('컵홀더에 고무 오리 두 마리! 하나는 다른 하나 뒤에 숨어 있다.');break;case 'foot':if(!S.ducks.includes('foot'))S.ducks.push('foot');say('조수석 발밑에 오리 네 마리. 누가 오리를 이렇게 많이 사?');break;case 'rearDuck':if(!S.ducks.includes('rear'))S.ducks.push('rear');say('뒷좌석의 외로운 오리 한 마리. 꽥.');break;case 'glove':if(S.glove){say('열린 수납함. 이제 아무것도 없다.');break}dialog('🔐 조수석 수납함','숫자 세 자리를 입력하는 잠금장치. 붙어 있는 메모:<br>"앞 · 발밑 · 뒤의 꽥꽥이를 순서대로 세어 봐!"',3);break;case 'bag':if(S.bag){say('가방은 비어 있다. 피자 냄새만 남았다.');break}dialog('🎒 수상한 가방','네 자리 자물쇠. 친구 글씨로 쓰여 있다.<br>"피자 주문번호를 맞혀봐!"',4);break;case 'floor':if(S.selected==='손전등'&&S.glove){S.lit=true;add('영수증');say('손전등으로 비추니 구겨진 영수증이! "주문번호 ??26"');}else say('좌석 아래가 너무 어둡다. 빛이 있으면 뭔가 보일 텐데.');break;case 'console':if(S.unlocked){say('스마트 잠금장치: UNLOCKED. 문을 열어보자.');break}if(!S.keyInserted){if(S.selected==='비상키'){S.keyInserted=true;S.selected=null;inventory();say('비상키를 꽂았다. 잠금장치에 네 자리 숫자 입력창이 떴다.');}else say('스마트 잠금장치가 먹통이다. 아래에 "EMERGENCY KEY" 슬롯이 보인다.');break}dialog('🔒 스마트 잠금장치','화면에 적혀 있다.<br>"이 숫자까지 잊었다면 우리 우정은 끝이야."',4);break;case 'door':if(S.unlocked){ending();break}say('철컥. 여전히 잠겼다. 창문 밖 주차장만 평화롭다.');break;default:say('별다른 것은 없다.') }render()}
function render(){const svg=$('scene');svg.innerHTML=S.room==='front'?front():rear();$('sceneName').textContent=S.room==='front'?'운전석 · 사물을 직접 눌러보세요':'뒷좌석 · 앞좌석은 위쪽을 눌러 이동';svg.querySelectorAll('[data-hit]').forEach(el=>{const action=()=>interact(el.dataset.hit);el.addEventListener('click',action);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}})});inventory()}
function reset(){S={room:'front',ducks:[],glove:false,lit:false,bag:false,keyInserted:false,unlocked:false,inventory:[],selected:null,solved:0,hintUsed:false};$('overlay').innerHTML='';render();say('차 안에서 눈을 떴다. 문이 잠겼다. 뭐부터 봐야 하지?')}
$('reset').onclick=()=>{if(confirm('처음부터 다시 시작할까?'))reset()};render();dialog('🚗 내 차에서 나 좀 꺼내줘!','어젯밤 친구들과 놀다 차에서 잠들었다.<br>눈을 떠보니 9시 58분. 10시 면접인데 문이 잠겼다!<br><br><strong>사물을 직접 눌러 조사해 봐.</strong><br>뒷좌석은 룸미러를 눌러 이동할 수 있어.<br>아이템은 아래 소지품에서 선택해 사용할 수 있어.',0);$('overlay').querySelector('#close').textContent='탈출 시작!';
</script></body></html>
