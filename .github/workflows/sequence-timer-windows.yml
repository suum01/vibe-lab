name: Build Windows Timer
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/sequence-timer/**'
      - '.github/workflows/sequence-timer-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sequence-timer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sequence-timer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: sequence-timer-windows
          path: apps/sequence-timer/dist/*.exe
          if-no-files-found: error
